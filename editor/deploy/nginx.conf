# Include these locations INSIDE the existing BBB HTTPS server block.
location = /recording-editor {
    return 301 /recording-editor/;
}
location ^~ /recording-editor/ {
    auth_basic "BBB Recording Editor (Administrator)";
    auth_basic_user_file /etc/nginx/bbb-recording-editor.htpasswd;
    client_max_body_size 1m;
    proxy_pass http://127.0.0.1:8099;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
}
