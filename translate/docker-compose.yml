# Caption translation server for the presentation player (LibreTranslate).
# Safari, Firefox, phones and tablets translate captions through it; Chrome
# uses its on-device translator when it can. See translate/README.md
services:
  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    container_name: bbb-playback-translate
    restart: unless-stopped
    # Only nginx on this host reaches it, at /playback/translate
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      # Same languages as captions.translate.languages in the player config
      LT_LOAD_ONLY: en,ar,de,es,fa,fr,hi,id,it,ja,ko,nl,pt,ru,tr,uk,ur,zh
      LT_UPDATE_MODELS: "true"
      LT_DISABLE_WEB_UI: "true"
      # The player sends 16 caption lines per request
      LT_BATCH_LIMIT: "32"
      LT_CHAR_LIMIT: "2000"
      LT_THREADS: "4"
    volumes:
      # Language models survive restarts and upgrades
      - models:/home/libretranslate/.local:rw
    healthcheck:
      test: ['CMD-SHELL', './venv/bin/python scripts/healthcheck.py']
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 120s

volumes:
  models:
